# Types, tests and formatting on every push and pull request to main.
# No secrets and no deploy: deploys run from the command line.
name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # check-types builds the server assets the tests read.
      - run: bun run check-types
      - run: bun test
      - run: bun run format:check
