name: milton-mcp-http
# Preserve the method when upgrading clients to the canonical HTTPS endpoint.
defaultUrlRedirect:
  hostRedirect: mcp.meetmilton.com
  httpsRedirect: true
  redirectResponseCode: PERMANENT_REDIRECT
  stripQuery: false
hostRules:
  - hosts:
      - app.meetmilton.com
    pathMatcher: browser-app
pathMatchers:
  - name: browser-app
    defaultUrlRedirect:
      hostRedirect: app.meetmilton.com
      httpsRedirect: true
      redirectResponseCode: PERMANENT_REDIRECT
      stripQuery: false
